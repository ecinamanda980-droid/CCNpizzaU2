<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PizzaKu</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  scroll-behavior: smooth;
}

/* NAVBAR */
.navbar {
  background: #2e7d32;
  color: white;
  display: flex;
  justify-content: space-between;
  padding: 15px 25px;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
}
.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
}

/* SECTION */
section {
  padding: 100px 20px;
  min-height: 100vh;
  text-align: center;
}

/* HERO */
#home {
  background: url('https://images.unsplash.com/photo-1601924582975-7d43d2fbb8cb') center/cover;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}
#home h1 {
  background: rgba(0,0,0,0.6);
  padding: 15px;
  border-radius: 10px;
}

/* MENU */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  transition: 0.3s;
}
.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

.price {
  color: green;
  font-weight: bold;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  background: #2e7d32;
  color: white;
  padding: 8px 12px;
  border-radius: 5px;
  text-decoration: none;
}

/* ABOUT */
#about {
  background: #f1f8e9;
}

/* KONTAK */
#kontak {
  background: #e8f5e9;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <b>🍕 PizzaKu</b>
  <div>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#about">About</a>
    <a href="#kontak">Kontak</a>
  </div>
</div>

<!-- HOME -->
<section id="home">
  <h1>Pizza Lezat & Fresh 🍕🔥</h1>
</section>

<!-- MENU -->
<section id="menu">
  <h2>Menu Pizza</h2>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1593560708920-61dd98c46a4e">
      <div class="card-content">
        <h4>Pepperoni</h4>
        <p class="price">Rp 85.000</p>
        <a href="#" class="btn">Pesan</a>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1548365328-9f547fb0953c">
      <div class="card-content">
        <h4>Cheese Pizza</h4>
        <p class="price">Rp 75.000</p>
        <a href="#" class="btn">Pesan</a>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
      <div class="card-content">
        <h4>Spicy Pizza</h4>
        <p class="price">Rp 90.000</p>
        <a href="#" class="btn">Pesan</a>
      </div>
    </div>

  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <h2>Tentang Kami</h2>
  <p>Kami menyediakan pizza terbaik dengan bahan segar dan rasa luar biasa 🍕</p>
</section>

<!-- KONTAK -->
<section id="kontak">
  <h2>Kontak</h2>
  <p>Hubungi kami di:</p>
  <h3>📞 081390029071</h3>
</section>

</body>
</html>
